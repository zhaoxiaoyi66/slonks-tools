<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Slonks Donor Efficiency Finder</title>
<style>body{font-family:system-ui;background:#0b0c10;color:#eef;padding:16px}input,select,textarea,button{margin:6px 0;padding:8px;width:100%}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #334;padding:6px}.warn{color:#ff6b6b}.ok{color:#4ade80}.card{background:#151820;padding:12px;border-radius:10px;margin-bottom:12px}</style></head>
<body>
<div class='card'><h2>Slonks 挂售候选优化（纯前端）</h2>
<p>只读链上 + Reservoir listing API；不连钱包、不发交易。</p>
<label>baseTokenId</label><input id='baseTokenId' value='1139'/>
<label>maxCandidates</label><input id='maxCandidates' type='number' value='100'/>
<label>maxPriceEth（可空）</label><input id='maxPriceEth' placeholder='例如 0.08'/>
<label>mode</label><select id='mode'><option value='base_only'>A 仅 base 做 survivor</option><option value='both'>B 允许反向（会标红警告）</option></select>
<button onclick='run()'>开始分析</button><button onclick='downloadCSV()'>下载最终排序 CSV</button></div>
<div class='card'><h3>进度 / 错误</h3><pre id='log'></pre></div>
<div class='card'><h3>Reservoir 失败时手动粘贴 listing CSV</h3><p>token_id,price_eth,marketplace,url</p><textarea id='manualCsv' rows='5'></textarea></div>
<div class='card'><h3>结果</h3><div id='out'></div></div>
<script src='https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js'></script>
<script>
const C='0x832233ddb7bcffd0ed53127dd6be3f1aa5845108',R='0x103d4ef6e7d87ea27355b402a4ae0875c3fb32a1',M='0xCa116243a2013ED33015c776ee37310b199Ee80c',MG='0x3e5bb2a724dBe9a6afE04ae7581639367693F51c';
const ABI={s:["function sourceIdFor(uint256) view returns (uint256)"],r:["function diffPixelCount(uint256) view returns (uint16)","function renderPixels(uint256) view returns (bytes)","function diffMask(uint256) view returns (bytes)","function originalPixelsForSource(uint256) view returns (bytes)"],m:["function sourceEmbedding(uint256) view returns (bytes)","function renderEmbeddingPixels(bytes) view returns (bytes)"],mg:["function mergeLevel(uint256) view returns (uint8)","function mergeEmbedding(uint256) view returns (bytes)"]};
let latest=[]; const log=(x)=>document.getElementById('log').textContent += x+'\n'; const setlog=(x)=>document.getElementById('log').textContent=x+'\n';
const p=new ethers.JsonRpcProvider('https://eth.llamarpc.com'); const cs={s:new ethers.Contract(C,ABI.s,p),r:new ethers.Contract(R,ABI.r,p),m:new ethers.Contract(M,ABI.m,p),mg:new ethers.Contract(MG,ABI.mg,p)};
const b=h=>Array.from(ethers.getBytes(h)); const ss=u=>u>127?u-256:u; const uu=s=>s<0?s+256:s; const blend=(a,bx)=>{a=b(a);bx=b(bx);let o=new Uint8Array(Math.min(a.length,bx.length));for(let i=0;i<o.length;i++)o[i]=uu(Math.trunc((ss(a[i])+ss(bx[i]))/2));return ethers.hexlify(o)};
let palette=new Map(); const hx=(arr,i)=>[arr[i],arr[i+1],arr[i+2],arr[i+3]].map(x=>x.toString(16).padStart(2,'0')).join(''); const isDiff=(m,p)=>(((m[Math.floor(p/8)]||0)>>(7-(p%8)))&1)===1;
function score(gen,orig){let mm=0,unk=0;for(let p=0;p<576;p++){const rgba=palette.get(gen[p]);if(!rgba){unk++;continue;} if(rgba!==hx(orig,p*4))mm++;}return {mm,unk,res:unk?mm+unk*0.5:mm,exact:unk===0,conf:1-unk/576};}
async function tk(id){const [sid,lv,sl]=await Promise.all([cs.s.sourceIdFor(id),cs.mg.mergeLevel(id),cs.r.diffPixelCount(id)]);const emb=Number(lv)===0?await cs.m.sourceEmbedding(sid):await cs.mg.mergeEmbedding(id);const [rp,dm,orig]=await Promise.all([cs.r.renderPixels(id),cs.r.diffMask(id),cs.r.originalPixelsForSource(sid)]);return {id,sourceId:Number(sid),level:Number(lv),slop:Number(sl),embedding:emb,renderPixels:b(rp),diffMask:b(dm),original:b(orig)};}
function addPalette(t){for(let p=0;p<576;p++) if(!isDiff(t.diffMask,p)) palette.set(t.renderPixels[p],hx(t.original,p*4));}
async function reservoirListings(){const u='https://api.reservoir.tools/orders/asks/v5?contracts='+C+'&status=active&sortBy=price&limit=200'; const r=await fetch(u,{headers:{'accept':'*/*'}}); if(!r.ok) throw new Error('Reservoir HTTP '+r.status); const j=await r.json(); const arr=(j.orders||[]).map(o=>({token_id:Number((o.criteria?.data?.token?.tokenId)||o.token?.tokenId),price_eth:Number(o.price?.amount?.decimal),marketplace:o.source?.name||'',url:o.source?.url||o.sourceUrl||'',reservoir:o.id?`https://reservoir.tools/ethereum/asset/${C}/${o.criteria?.data?.token?.tokenId}`:''})).filter(x=>Number.isInteger(x.token_id)&&x.price_eth>0); return arr;}
function parseManual(){const t=document.getElementById('manualCsv').value.trim(); if(!t) return []; const l=t.split(/\r?\n/); return l.slice(1).map(x=>x.split(',')).map(c=>({token_id:Number(c[0]),price_eth:Number(c[1]),marketplace:(c[2]||''),url:(c[3]||''),reservoir:''})).filter(x=>Number.isInteger(x.token_id)&&x.price_eth>0);}
function links(id,row){return `<a target=_blank href='https://opensea.io/assets/ethereum/${C}/${id}'>OpenSea</a> ${row.reservoir?`| <a target=_blank href='${row.reservoir}'>Reservoir</a>`:''}`}
async function run(){setlog('正在读取 base token...'); latest=[]; palette=new Map();
try{const baseId=Number(document.getElementById('baseTokenId').value);const maxC=Math.max(1,Number(document.getElementById('maxCandidates').value||100));const mp=document.getElementById('maxPriceEth').value.trim();const maxP=mp?Number(mp):null;const mode=document.getElementById('mode').value;
const base=await tk(baseId);addPalette(base); log(`base level=${base.level}, slop=${base.slop}, sourceId=${base.sourceId}`);
log('正在获取 marketplace listings...'); let listings=[]; try{listings=await reservoirListings();log('已获取挂售 token: '+listings.length);}catch(e){log('Reservoir 失败: '+e.message); listings=parseManual(); if(!listings.length) throw new Error('Reservoir失败且未提供手动CSV'); log('改用手动CSV，条数: '+listings.length);} 
if(maxP!==null) listings=listings.filter(x=>x.price_eth<=maxP); listings=listings.filter(x=>x.token_id!==baseId).slice(0,maxC);
let candidates=[]; for(let i=0;i<listings.length;i++){try{const t=await tk(listings[i].token_id); if(t.level===base.level) candidates.push({...listings[i],token:t});}catch{} if((i+1)%10===0) log(`已读取候选 ${i+1}/${listings.length}`);} log('已筛选同level候选: '+candidates.length);
let done=0; for(const c of candidates){for(const dir of (mode==='both'?[0,1]:[0])){const survivor=dir===0?base:c.token, donor=dir===0?c.token:base; const sc=score(b(await cs.m.renderEmbeddingPixels(blend(survivor.embedding,donor.embedding))),survivor.original); const resultSlop=sc.res; const gross=resultSlop-survivor.slop, net=resultSlop-survivor.slop-donor.slop, pe=c.price_eth||0; latest.push({baseTokenId:baseId,candidateTokenId:c.token_id,priceEth:pe,marketplace:c.marketplace,baseLevel:base.level,baseSlop:base.slop,donorSlop:donor.slop,resultSlop,grossDelta:gross,netDelta:net,grossSlopPerEth:pe?gross/pe:null,netSlopPerEth:pe?net/pe:null,opensea:`https://opensea.io/assets/ethereum/${C}/${c.token_id}`,reservoir:c.reservoir||c.url,confidence:sc.exact?'exact':'estimated',reverse:dir===1}); done++; if(done%10===0)log('已模拟组合: '+done);}}
latest.sort((a,b)=>(b.netSlopPerEth??-1e9)-(a.netSlopPerEth??-1e9)||(b.grossSlopPerEth??-1e9)-(a.grossSlopPerEth??-1e9)||(b.resultSlop??-1e9)-(a.resultSlop??-1e9)||(a.priceEth??1e9)-(b.priceEth??1e9));
render(); log('完成。');}catch(e){log('错误: '+e.message)} }
function render(){let h='<table><thead><tr><th>rank</th><th>baseTokenId</th><th>candidateTokenId</th><th>price ETH</th><th>marketplace</th><th>base level</th><th>base slop</th><th>donor slop</th><th>predicted result slop</th><th>grossDelta</th><th>netDelta</th><th>grossSlopPerEth</th><th>netSlopPerEth</th><th>links</th><th>confidence</th></tr></thead><tbody>';
latest.forEach((r,i)=>h+=`<tr ${r.reverse?"style='background:#3a1f1f'":''}><td>${i+1}</td><td>${r.baseTokenId}</td><td>${r.candidateTokenId}${r.reverse?" <span class='warn'>(会烧掉 base token，不建议默认执行)</span>":''}</td><td>${r.priceEth}</td><td>${r.marketplace}</td><td>${r.baseLevel}</td><td>${r.baseSlop}</td><td>${r.donorSlop}</td><td>${r.resultSlop.toFixed(2)}</td><td>${r.grossDelta.toFixed(2)}</td><td>${r.netDelta.toFixed(2)}</td><td>${r.grossSlopPerEth?.toFixed?.(4)||''}</td><td>${r.netSlopPerEth?.toFixed?.(4)||''}</td><td>${links(r.candidateTokenId,r)}</td><td>${r.confidence}</td></tr>`); document.getElementById('out').innerHTML=h+'</tbody></table>';}
function downloadCSV(){if(!latest.length)return; const f=['baseTokenId','candidateTokenId','priceEth','marketplace','baseLevel','baseSlop','donorSlop','resultSlop','grossDelta','netDelta','grossSlopPerEth','netSlopPerEth','opensea','reservoir','confidence','reverse']; const lines=[f.join(',')]; latest.forEach(r=>lines.push(f.map(k=>JSON.stringify(r[k]??'')).join(','))); const b=new Blob([lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='ranked_listing_candidates.csv'; a.click();}
</script></body></html>
